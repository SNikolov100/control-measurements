{% extends "base.html" %}

{% block title %}
    Create specialty | Control Measurements
{% endblock %}

{% block content %}
    <h2>Create specialty</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save
        </button>
    </form>

    <p>
        <a href= "{% url 'core:specialty-list' %}" >
            Back to specialties
        </a>
    </p>
{% endblock %}
