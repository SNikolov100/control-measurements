{% extends "base.html" %}

{% block title %}
    Edit specialty | Control Measurements
{% endblock %}

{% block content %}
    <h2>Edit specialty</h2>

    <form method="post" novalidate>
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save changes
        </button>
    </form>

    <p>
        <a href="{% url 'core:specialty-list' %}" >
            Back to specialties
        </a>
    </p>
{% endblock %}
