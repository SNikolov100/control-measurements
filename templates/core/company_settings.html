{% extends "base.html" %}

{% block title %}
    Company settings | Control Measurements
{% endblock %}

{% block content %}
    <h2>Company settings</h2>

    <p>
        Enter the details of the company operating the measurement
        control system.
    </p>

    <form method="post" novalidate>
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save company settings
        </button>
    </form>

    <p>
        <a href="{% url 'core:home' %}">
            Back to home
        </a>
    </p>
{% endblock %}
