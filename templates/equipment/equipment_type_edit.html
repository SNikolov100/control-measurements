{% extends "base.html" %}

{% block title %}
    Edit equipment type | Control Measurements
{% endblock %}

{% block content %}
    <h2>Edit equipment type</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save changes
        </button>
    </form>

    <p>
        <a href="{% url 'equipment:types-list' %}">
            Back to equipment types
        </a>
    </p>
{% endblock %}
