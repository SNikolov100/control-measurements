{% extends "base.html" %}

{% block title %}
    Add customer | Control Measurements
{% endblock %}

{% block content %}
    <h2>Add customer</h2>

    <p>
        Enter the company information for the new customer.
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save customer
        </button>
    </form>

    <p>
        <a href="{% url 'customers:list' %}">
            Back to customers
        </a>
    </p>
{% endblock %}
