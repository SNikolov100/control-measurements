{% extends "base.html" %}

{% block title %}
    Login | Control Measurements
{% endblock %}

{% block content %}

    <section class="card">
        <h1>Login</h1>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            {% if next %}
                <input type="hidden"
                       name="next"
                       value="{{ next }}">
            {% endif %}

            <button type="submit">
                Login
            </button>
        </form>
    </section>

{% endblock %}
